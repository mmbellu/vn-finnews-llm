experiment:
  project_name: "vn-finnews-qlora"
  run_name: "qwen3-4b-r16-fp16-t4"
  seed: 42

model:
  base_model_id: "Qwen/Qwen3-4B-Instruct-2507"
  max_length: 512
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16"   # Bắt buộc float16 trên T4

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "./outputs/qwen3-4b-vn-finnews"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8      # Effective batch size = 2 * 8 = 16
  learning_rate: 1.5e-4               # Hơi thận trọng hơn 2e-4 để tránh NaN ở fp16
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 0.3
  optim: "paged_adamw_8bit"
  fp16: true
  bf16: false
  gradient_checkpointing: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 50

data:
  dataset_id: "mmbellu/vn-finnews-structured"
  local_dir: "data/processed"

hub:
  adapter_repo_id: "mmbellu/qwen3-4b-vn-finnews-lora"
  merged_repo_id: "mmbellu/qwen3-4b-vn-finnews-merged"